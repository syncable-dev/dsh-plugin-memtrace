# Memtrace bundle layer for DeepSeek Harness: two rows owned by this package.
# - dsh-plugin-memtrace registers the Memtrace agent skills at apply time.
# - mcp-memtrace is the official DSH MCP client running `memtrace mcp`.
# `memtrace mcp` anchors on its working directory. `perWorkingDirectory`
# routes each tool call to a child in the calling Session's directory; a
# dsh-mcp-client without it ignores the key, so restate this row with
# `cwd: <repo root>`. Values stay literal except the scalar command: the
# 0.2.x composer mangles `!!js` values that return arrays.
- insert:
    - id: dsh-plugin-memtrace
      name: dsh-plugin-memtrace
    - id: mcp-memtrace
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: memtrace
        transport: stdio
        perWorkingDirectory: true
        command: !!js process.env.MEMTRACE_BIN || 'memtrace'
        args:
          - mcp
        failOnStartupError: false
        toolCallTimeoutMs: 180000
        reconnect:
          enabled: true
          initialDelayMs: 500
          maxDelayMs: 30000
          maxAttempts: 10
