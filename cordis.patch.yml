# Memtrace bundle layer for DeepSeek Harness.
#
# Two rows, both owned by this package:
# - dsh-plugin-memtrace registers the Memtrace agent skills at apply time and
#   ensures the `dsh` Named Workspace exists (memtrace workspace create dsh).
# - mcp-memtrace is the official DSH MCP client pointed at
#   `memtrace mcp --workspace dsh`. The named workspace gives the child a
#   resolvable scope: when no `memtrace start` owns it, the MCP process
#   itself takes the workspace-owner lease and starts the local MemDB
#   sidecar (verified against memtrace 1.2.21), with the store under
#   ~/.memtrace/workspaces/data/<id>/. Every value stays literal on
#   purpose: the 0.2.x patch composer mangles evaluated !!js values that
#   return arrays. To serve one repository's own .memdb instead, restate
#   this row in the profile's cordis.patch.yml with cwd: <repo> and no
#   --workspace flag.
- insert:
    - id: dsh-plugin-memtrace
      name: dsh-plugin-memtrace
    - id: mcp-memtrace
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: memtrace
        transport: stdio
        command: npx
        args:
          - '-y'
          - memtrace
          - mcp
          - '--workspace'
          - dsh
        failOnStartupError: false
        toolCallTimeoutMs: 180000
        reconnect:
          enabled: true
          initialDelayMs: 500
          maxDelayMs: 30000
          maxAttempts: 10
